# Single entry point in front of however many API replicas are running.
# `docker compose up --scale api=3` adds containers behind the one name "api";
# nginx asks Docker's DNS (127.0.0.11) again every 5s, so new replicas get traffic
# without a restart, and requests rotate across them.

# Keep a caller's x-request-id; otherwise mint one here so logs line up end to end.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ''      $request_id;
}

server {
    listen 80;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:3000;

    location / {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $req_id;
        # Longer than WORKFLOW_TIMEOUT_MS, so the API answers (with cache or 503) before nginx gives up.
        proxy_read_timeout 15s;
        # Shows which replica answered; handy for the scaling demo.
        add_header X-Upstream $upstream_addr always;
    }
}
